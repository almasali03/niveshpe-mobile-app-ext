<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investor Details - NiveshPe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="assets/css/iphone-toggle.css">

    <style>
        :root {
            --color-blue: #2563EB;
            --color-blue-dark: #1D4ED8;
            --color-text-primary: #1F2937;
            --color-text-secondary: #6B7280;
            --color-text-muted: #9CA3AF;
            --color-border: #E5E7EB;
            --color-surface: #F9FAFB;
            --color-red: #EF4444;
            --radius-md: 12px;
            --radius-full: 9999px;
            --screen-bg: #F0F9FF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: var(--color-text-primary);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
        }

        .iphone-frame {
            width: 380px;
            height: 820px;
            background: transparent;
            margin: 0 auto;
            position: relative;
        }

        .iphone-screen {
            width: 100%;
            height: 100%;
            background: var(--screen-bg);
            overflow: hidden;
            transition: background 0.3s ease;
        }

        .mobile-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ==================== ANIMATIONS ==================== */

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==================== STATUS BAR ==================== */

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            height: 44px;
            flex-shrink: 0;
            font-size: 15px;
            font-weight: 600;
            color: #1A1A1A;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            font-size: 13px;
        }

        /* ==================== HEADER ==================== */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            height: 60px;
            flex-shrink: 0;
            border-bottom: 1px solid #E5E7EB;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background: var(--color-surface);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .back-btn:active {
            background: var(--color-border);
            transform: scale(0.95);
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--color-text-primary);
        }

        /* ==================== CONTENT AREA ==================== */

        .content-area {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 24px 20px;
            display: none;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 0.3s ease;
        }

        .content-area.active {
            display: flex;
        }

        /* ==================== STEP INDICATOR ==================== */

        .step-indicator {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .step-title {
            font-size: 24px;
            font-weight: 700;
            color: #1F2937;
            line-height: 1.2;
        }

        .step-desc {
            font-size: 14px;
            color: #6B7280;
            line-height: 1.5;
        }

        /* ==================== FORM FIELDS ==================== */

        .form-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .field-label {
            font-size: 14px;
            font-weight: 600;
            color: #1F2937;
        }

        .field-input {
            width: 100%;
            height: 52px;
            padding: 0 16px;
            border: 2px solid #E5E7EB;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            color: #1F2937;
            background: #FFFFFF;
            appearance: none;
            -webkit-appearance: none;
            transition: border-color 0.2s;
        }

        .field-input:focus {
            outline: none;
            border-color: #2563EB;
        }

        .field-input option:disabled {
            color: #9CA3AF;
        }

        .income-wrapper {
            position: relative;
        }

        .income-prefix {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            font-weight: 700;
            color: #1F2937;
            pointer-events: none;
            z-index: 1;
        }

        .income-input {
            padding-left: 34px !important;
        }

        /* ==================== PILL BUTTONS ==================== */

        .pill-group {
            display: flex;
            gap: 8px;
        }

        .pill-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .pill-btn {
            height: 48px;
            border-radius: 8px;
            background: #F9FAFB;
            border: 1.5px solid #E5E7EB;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            color: #1F2937;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pill-group .pill-btn {
            flex: 1;
        }

        .pill-btn.selected {
            background: #F0FDFA;
            border-color: #F0FDFA;
            color: #134E4A;
        }

        .pill-btn:active {
            transform: scale(0.97);
        }

        /* ==================== BUTTONS ==================== */

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
            padding-top: 8px;
        }

        .btn-primary {
            width: 100%;
            height: 52px;
            background: var(--color-blue);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary:active:not(:disabled) {
            transform: scale(0.98);
            background: var(--color-blue-dark);
        }

        .btn-primary:disabled {
            background: var(--color-border);
            color: var(--color-text-muted);
            cursor: not-allowed;
        }

        .btn-secondary {
            width: 100%;
            height: 52px;
            background: white;
            color: var(--color-blue);
            border: 2px solid var(--color-blue);
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-secondary:active {
            transform: scale(0.98);
            background: rgba(37, 99, 235, 0.05);
        }

        /* ==================== LOADING STATE ==================== */

        .loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: var(--screen-bg);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            z-index: 10;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #E5E7EB;
            border-top-color: #2563EB;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            font-size: 16px;
            font-weight: 600;
            color: #1F2937;
        }

        .loading-subtext {
            font-size: 14px;
            color: #6B7280;
        }
    </style>
</head>
<body>
    <!-- iPhone Toggle Button -->
    <button class="frame-toggle-btn" onclick="toggleFrameMode()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
        </svg>
        <span id="frameToggleText">Normal View</span>
    </button>

    <div class="iphone-frame">
        <div class="iphone-notch"></div>
        <div class="iphone-screen" id="iphoneScreen">
            <div class="mobile-container">

                <!-- Status Bar -->
                <div class="status-bar">
                    <span>9:41</span>
                    <div class="status-icons">
                        <span>📶</span>
                        <span>📡</span>
                        <span>🔋</span>
                    </div>
                </div>

                <!-- Header -->
                <div class="header">
                    <button class="back-btn" onclick="handleBack()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6z"/>
                        </svg>
                    </button>
                    <div class="header-title">Investor Details</div>
                    <div style="width:40px;"></div>
                </div>

                <!-- ===== Single-step form ===== -->
                <div class="content-area active" id="step1">
                    <div class="step-indicator">
                        <h2 class="step-title">Complete Your Profile</h2>
                        <p class="step-desc">Tell us a bit about yourself to get started</p>
                    </div>

                    <div class="form-container">
                        <!-- Occupation -->
                        <div class="form-group">
                            <label class="field-label" for="occupation">What is your occupation?</label>
                            <select id="occupation" class="field-input" onchange="validateForm()">
                                <option value="" disabled selected>Select your occupation</option>
                                <option value="private-job">Private Job</option>
                                <option value="business">Business</option>
                                <option value="shopkeeper">Shopkeeper</option>
                                <option value="freelancer">Freelancer</option>
                                <option value="professional">Professional</option>
                                <option value="student">Student</option>
                                <option value="homemaker">Home-maker/Housewife</option>
                                <option value="retired">Retired</option>
                                <option value="govt-service">Govt Service</option>
                                <option value="psu">Public Sector Service</option>
                                <option value="agriculture">Agriculture</option>
                                <option value="others">Others</option>
                            </select>
                        </div>

                        <!-- Monthly Income -->
                        <div class="form-group">
                            <label class="field-label" for="monthlyIncome">What's your monthly income?</label>
                            <div class="income-wrapper">
                                <span class="income-prefix">₹</span>
                                <input type="tel" id="monthlyIncome" class="field-input income-input"
                                       placeholder="50,000" oninput="validateForm()">
                            </div>
                        </div>

                        <!-- Source of Funds -->
                        <div class="form-group">
                            <label class="field-label" for="sourceOfFunds">Primary source of funds</label>
                            <select id="sourceOfFunds" class="field-input" onchange="validateForm()">
                                <option value="" disabled selected>Select source of funds</option>
                                <option value="salary">Salary</option>
                                <option value="business-income">Business Income</option>
                                <option value="rent">Rent</option>
                                <option value="property">Property Sale</option>
                                <option value="gift">Gift</option>
                                <option value="royalty">Royalty</option>
                                <option value="others">Others</option>
                            </select>
                        </div>

                        <!-- Marital Status -->
                        <div class="form-group">
                            <label class="field-label">Marital status</label>
                            <div class="pill-group">
                                <button class="pill-btn" id="pill-single" onclick="selectMarital('single')">Single</button>
                                <button class="pill-btn" id="pill-married" onclick="selectMarital('married')">Married</button>
                            </div>
                        </div>

                        <!-- Number of Dependents -->
                        <div class="form-group">
                            <label class="field-label">Number of dependents</label>
                            <div class="pill-grid">
                                <button class="pill-btn" id="pill-dep0" onclick="selectDependents('0')">0</button>
                                <button class="pill-btn" id="pill-dep1" onclick="selectDependents('1')">1</button>
                                <button class="pill-btn" id="pill-dep2" onclick="selectDependents('2')">2</button>
                                <button class="pill-btn" id="pill-dep3" onclick="selectDependents('3+')">3+</button>
                            </div>
                        </div>
                    </div>

                    <div class="button-container">
                        <button class="btn-primary" id="submitBtn" disabled onclick="submitForm()">Submit Details</button>
                    </div>
                </div>

                <!-- Loading overlay -->
                <div class="loading-overlay" id="loadingState">
                    <div class="loading-spinner"></div>
                    <div class="loading-text">Submitting Details...</div>
                    <div class="loading-subtext">Please wait while we process your information</div>
                </div>

            </div>
        </div>
        <div class="iphone-home-indicator"></div>
    </div>

    <script src="assets/js/iphone-toggle.js"></script>

    <script>
        // ==================== STATE ====================

        let selectedMarital = null;
        let selectedDependents = null;

        // ==================== NAVIGATION ====================

        function handleBack() {
            window.location.href = 'index.html';
        }

        // ==================== VALIDATION ====================

        function validateForm() {
            const occ = document.getElementById('occupation').value;
            const inc = document.getElementById('monthlyIncome').value.trim();
            const src = document.getElementById('sourceOfFunds').value;
            document.getElementById('submitBtn').disabled = !(occ && inc && src && selectedMarital && selectedDependents);
        }

        // ==================== SELECTIONS ====================

        function selectMarital(val) {
            selectedMarital = val;
            document.getElementById('pill-single').classList.toggle('selected', val === 'single');
            document.getElementById('pill-married').classList.toggle('selected', val === 'married');
            validateForm();
        }

        function selectDependents(val) {
            selectedDependents = val;
            ['0', '1', '2', '3+'].forEach(v => {
                const id = 'pill-dep' + v.replace('+', '');
                document.getElementById(id).classList.toggle('selected', v === val);
            });
            validateForm();
        }

        // ==================== SUBMIT ====================

        function submitForm() {
            document.getElementById('step1').classList.remove('active');
            document.getElementById('loadingState').classList.add('show');

            setTimeout(() => {
                window.location.href = 'mutual-funds.html';
            }, 2000);
        }
    </script>
</body>
</html>
